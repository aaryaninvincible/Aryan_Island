<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="560" height="560">
  <defs>
    <radialGradient id="pondBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#120c1e"/>
      <stop offset="60%" stop-color="#07050d"/>
      <stop offset="100%" stop-color="#020104"/>
    </radialGradient>
    <linearGradient id="pondOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A3C"/>
      <stop offset="50%" stop-color="#FF7300"/>
      <stop offset="100%" stop-color="#FF3700"/>
    </linearGradient>
    <linearGradient id="pondCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="25%" stop-color="rgba(255,255,255,0.2)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="pondGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Obsidian Glass Finish -->
  <rect width="560" height="560" rx="130" fill="url(#pondBg)"/>

  <!-- Ambient Light Halos (Orange + Cyan) -->
  <circle cx="280" cy="240" r="140" fill="#FF7300" opacity="0.18" filter="url(#pondGlow)"/>
  <circle cx="280" cy="360" r="120" fill="#00F3FF" opacity="0.14" filter="url(#pondGlow)"/>

  <!-- Dynamic Pond Island Ripple Rings -->
  <ellipse cx="280" cy="280" rx="190" ry="85" fill="none" stroke="url(#pondCyan)" stroke-width="2" opacity="0.35"/>
  <ellipse cx="280" cy="280" rx="145" ry="60" fill="none" stroke="url(#pondOrange)" stroke-width="3" opacity="0.55"/>

  <!-- Central Dynamic Island Pill Floating in the Pond -->
  <rect x="130" y="242" width="300" height="76" rx="38" fill="rgba(255,255,255,0.09)"/>
  <rect x="130" y="242" width="300" height="76" rx="38" stroke="url(#specularRim)" stroke-width="2.5" fill="none"/>

  <!-- Liquid Light Specular Accent Line -->
  <path d="M 160 252 Q 280 248 400 252" stroke="rgba(255,255,255,0.8)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Core Dynamic Sparks & Waveform -->
  <circle cx="178" cy="280" r="12" fill="url(#pondOrange)"/>
  <rect x="220" y="271" width="5" height="18" rx="2.5" fill="#00F3FF"/>
  <rect x="232" y="263" width="5" height="34" rx="2.5" fill="url(#pondOrange)"/>
  <rect x="244" y="267" width="5" height="26" rx="2.5" fill="#00F3FF"/>
  <rect x="256" y="274" width="5" height="12" rx="2.5" fill="url(#pondOrange)"/>

  <text x="345" y="287" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="1">POND</text>

  <!-- Surrounding Starlight Refractions -->
  <circle cx="100" cy="140" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="440" cy="130" r="2.5" fill="#00F3FF" opacity="0.8"/>
  <circle cx="460" cy="420" r="3.5" fill="#FF7300" opacity="0.75"/>
  <circle cx="110" cy="410" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
